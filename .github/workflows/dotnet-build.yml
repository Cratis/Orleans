name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  # Temporary migration proof: the last source state before the xUnit v3 migration. Remove with the parity steps below.
  BASELINE_SHA: db2df1708bb71e190227e4dd783ae19d2ca840c1

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Integration/**"
      - "Directory.Packages*.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - ".github/package-smoke/**"
      - ".github/scripts/run-specifications.sh"
      - ".github/scripts/run-specifications.test.mjs"
      - ".github/scripts/compare-specifications.mjs"
      - ".github/scripts/compare-specifications.test.mjs"
      - "Orleans.slnx"
      - "global.json"
      - ".github/workflows/dotnet-build.yml"
      - ".github/workflows/grain-compatibility.yml"

jobs:
  # Fails a change to a grain interface that silos of the latest release could not call during a rolling upgrade.
  grain-compatibility:
    uses: ./.github/workflows/grain-compatibility.yml

  build:
    needs: [grain-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The integration specs run the job system end to end against a real MongoDB.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Built once, in Release like publish (warnings as errors); every later step runs the built output.
      - name: Build
        run: dotnet build --configuration Release

      - name: Verify specification runner
        run: bash .github/scripts/run-specifications.sh --self-test

      - name: Verify specification parity comparison
        run: node .github/scripts/compare-specifications.mjs --self-test

      # The runner executes the eight xUnit v3 test programs one at a time and fails on a missing project, a missing
      # or empty result, or a nonzero exit, so a run that discovers nothing cannot pass. It never builds.
      - name: Run specifications (ordinary and integration)
        run: bash .github/scripts/run-specifications.sh Release --results TestResults/candidate

      # Temporary migration proof, removed once the pull request's CI evidence is captured: run the same eight
      # projects from the immutable pre-migration commit with the old runner, in an isolated checkout outside the
      # workspace so its build files cannot mix with this tree's, then require identical cases and outcomes.
      - name: Fetch pre-migration source
        run: |
          git fetch --depth=1 origin "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/orleans-baseline" "$BASELINE_SHA"
          test "$(git -C "$RUNNER_TEMP/orleans-baseline" rev-parse HEAD)" = "$BASELINE_SHA"

      - name: Build pre-migration source
        run: dotnet build "$RUNNER_TEMP/orleans-baseline/Orleans.slnx" --configuration Release

      - name: Run pre-migration specifications
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/orleans-baseline"
          mapfile -t projects < <(node .github/scripts/compare-specifications.mjs --list-projects all | cut -f1)
          test "${#projects[@]}" -eq 8
          for path in "${projects[@]}"; do
            name=$(basename "$path" .csproj)
            out="$PWD/TestResults/baseline/$name"
            mkdir -p "$out"
            dotnet test "$baseline/$path" --configuration Release --no-build --no-restore --list-tests > "$out/discovery.txt"
            dotnet test "$baseline/$path" --configuration Release --no-build --no-restore --logger "trx;LogFileName=$name.trx" --results-directory "$out"
          done

      - name: Compare pre- and post-migration cases and outcomes
        run: node .github/scripts/compare-specifications.mjs --baseline TestResults/baseline --candidate TestResults/candidate --scope all

      - name: Verify packed Orleans dependencies for supported frameworks
        run: bash .github/package-smoke/verify.sh

      - name: Upload specification results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specification-results
          path: TestResults/
          if-no-files-found: ignore
